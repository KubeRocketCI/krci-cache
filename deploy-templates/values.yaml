# Default values for krci-cache.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# krci-cache container image configurations.
image:
  # -- krci-cache container image. Add a registry prefix to use a mirror or a private registry.
  repository: epamedp/krci-cache
  # -- Defines the policy with which pod will request its image.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# InitContainer configurations.
initContainers:
  # -- Defines the repository.
  repository: busybox
  # -- InitContainer image.
  tag: 1.36.1

# -- Specifies secrets for pulling Docker images.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Annotations to be added to krci-cache pods.
podAnnotations: {}
# -- Specifies privilege and access control configurations for krci-cache pods.
# runAsUser and runAsGroup set the cache volume owner applied by the fix-permissions init container.
# Default 1001 matches the image USER.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Security context to be added to krci-cache pods.
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Defines size of the Persistent Volume that is used for cache.
cacheSize: "5Gi"

# -- krci-cache service configurations.
service:
  name: "krci-cache"
  type: ClusterIP
  port: 8080

# -- krci-cache pod resource requests and limits.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Node labels for krci-cache pod assignment.
nodeSelector: {}
# -- Node tolerations for pod scheduling to nodes with taints.
tolerations: []
# -- Pod affinity.
affinity: {}
