name: Create KRCI release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.27'
  GITCHGLOG_VERSION: 'v0.15.4'
  CRANE_VERSION: 'v0.16.1'
  REKOR_CLI_VERSION: 'v1.3.3'
  # Pushed and cosign-signed by the KRCI release pipeline before it pushes the tag.
  IMAGE_NAME: 'epamedp/krci-cache'

permissions:
  contents: write

jobs:
  prepare-release:
    name: Perform automatic release on trigger ${{ github.ref }}
    runs-on: ubuntu-latest
    env:
      # The name of the tag as supplied by the GitHub event, e.g. refs/tags/v0.5.0
      SOURCE_TAG: ${{ github.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Generate release notes
        run: |
          set -xueo pipefail

          # Registry and Rekor can lag behind the tag push: retry each lookup.
          # RETRY_ATTEMPTS tries, waiting RETRY_DELAY * attempt seconds between them.
          RETRY_ATTEMPTS="${RETRY_ATTEMPTS:-5}"
          RETRY_DELAY="${RETRY_DELAY:-15}"

          # retry <command...>: run the command until it succeeds, at most RETRY_ATTEMPTS
          # times. Stdout is passed through, log lines go to stderr.
          retry() {
            attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -ge "${RETRY_ATTEMPTS}" ]; then
                echo "::error::'$*' failed after ${attempt} attempts" >&2
                return 1
              fi
              delay=$(( RETRY_DELAY * attempt ))
              echo "'$*' failed (attempt ${attempt}/${RETRY_ATTEMPTS}), retrying in ${delay}s" >&2
              sleep "${delay}"
              attempt=$(( attempt + 1 ))
            done
          }

          # Print the digest of the first layer of an image manifest. Fails if it is missing.
          layer_digest() {
            d=$(crane manifest "$1" | jq -r '.layers[0].digest // empty')
            [ -n "${d}" ] || return 1
            echo "${d}"
          }

          # Print the Rekor entry UUID for a layer digest. Fails if there is none yet.
          rekor_uuid() {
            u=$(rekor-cli search --sha "$1" --format json | jq -r '.UUIDs[0] // empty')
            [ -n "${u}" ] || return 1
            echo "${u}"
          }

          # refs/tags/v0.5.0 -> v0.5.0
          RELEASE_TAG="${SOURCE_TAG##*/}"
          IMAGE_TAG="${RELEASE_TAG#v}"

          retry go install github.com/git-chglog/git-chglog/cmd/git-chglog@${GITCHGLOG_VERSION}
          retry go install github.com/google/go-containerregistry/cmd/crane@${CRANE_VERSION}
          retry go install github.com/sigstore/rekor/cmd/rekor-cli@${REKOR_CLI_VERSION}

          git-chglog --template .chglog/release.tpl.md -o changelog.md "${RELEASE_TAG}"

          DIGEST=$(retry crane digest "${IMAGE_NAME}:${IMAGE_TAG}" | tr ':' '-')
          ATTESTATION_DIGEST=$(retry layer_digest "${IMAGE_NAME}:${DIGEST}.att")
          SIGNATURE_DIGEST=$(retry layer_digest "${IMAGE_NAME}:${DIGEST}.sig")
          ATTESTATION_UUID=$(retry rekor_uuid "${ATTESTATION_DIGEST}")
          SIGNATURE_UUID=$(retry rekor_uuid "${SIGNATURE_DIGEST}")

          {
            echo "### Deployment Certifications and Source Traceability"
            echo "KubeRocketCI container images bear [cosign](https://github.com/sigstore/cosign) signatures. Refer to the [documentation](https://docs.kuberocketci.io/docs/developer-guide/artifacts-verification) for instructions on verification."
            echo "The Rekor UUID's for this release is \`${ATTESTATION_UUID}\` - attestation and"
            echo "\`${SIGNATURE_UUID}\` - signature"
            cat changelog.md
          } > release.md

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release.md
